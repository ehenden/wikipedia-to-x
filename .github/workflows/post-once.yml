name: Post Random Turkish Wikipedia

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours, away from peak load
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: wikipedia-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Restore durable article history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py restore
      - name: Post once
        env:
          PUBLISH_PROVIDER: buffer
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          HISTORY_DAYS: 60
          TOPIC_DAYS: 14
          RN_MINSIZE: 8000
        run: python bot.py --once
      - name: Save durable article history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py save
