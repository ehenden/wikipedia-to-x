name: Publish Wikipedia

on:
  schedule:
    - cron: '17,47 * * * *' # every 30 minutes, away from peak load
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing or changing history
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: wikipedia-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Restore durable article history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py restore
      - name: Load private summary overlay
        if: ${{ vars.AI_SUMMARY_RUNNER != '' }}
        env:
          AI_SUMMARY_RUNNER: ${{ vars.AI_SUMMARY_RUNNER }}
        run: python -c 'import os; from pathlib import Path; Path("ai_summary_runner.py").write_text(os.environ["AI_SUMMARY_RUNNER"])'
      - name: Post once
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          WIKI_LANGUAGE: ${{ vars.WIKI_LANGUAGE || 'tr' }}
          ARTICLE_SOURCE: ${{ vars.ARTICLE_SOURCE || 'popular' }}
          WIKI_CATEGORY: ${{ vars.WIKI_CATEGORY }}
          HISTORY_DAYS: ${{ vars.HISTORY_DAYS || '60' }}
          TOPIC_DAYS: ${{ vars.TOPIC_DAYS || '14' }}
          RN_MINSIZE: ${{ vars.RN_MINSIZE || '8000' }}
          DRY_RUN: ${{ inputs.dry_run }}
          AI_SUMMARY_ENABLED: ${{ vars.AI_SUMMARY_RUNNER != '' }}
        run: |
          runner=bot.py
          if [ "$AI_SUMMARY_ENABLED" = "true" ]; then
            runner=ai_summary_runner.py
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python "$runner" --dry-run
          else
            python "$runner"
          fi
      - name: Save durable article history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py save
