name: Publish Wikipedia

on:
  schedule:
    - cron: '2/5 * * * *' # check every 5 minutes; history enforces the 30-minute interval
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing or changing history
        type: boolean
        default: false
      keep_running:
        description: Continue hosted publication cycles (requires CONTINUOUS_PUBLISHING=true)
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cycle_delay: ${{ steps.delay.outputs.seconds }}
    permissions:
      contents: write
    concurrency:
      group: wikipedia-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Restore durable article history
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py restore
      - name: Load private summary overlay
        if: ${{ vars.AI_SUMMARY_RUNNER != '' }}
        env:
          AI_SUMMARY_RUNNER: ${{ vars.AI_SUMMARY_RUNNER }}
        run: python -c 'import os; from pathlib import Path; Path("ai_summary_runner.py").write_text(os.environ["AI_SUMMARY_RUNNER"])'
      - name: Post once
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_HOSTED_RESERVATION: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          WIKI_LANGUAGE: ${{ vars.WIKI_LANGUAGE || 'tr' }}
          ARTICLE_SOURCE: ${{ vars.ARTICLE_SOURCE || 'popular' }}
          WIKI_CATEGORY: ${{ vars.WIKI_CATEGORY }}
          HISTORY_DAYS: ${{ vars.HISTORY_DAYS || '60' }}
          TOPIC_DAYS: ${{ vars.TOPIC_DAYS || '14' }}
          RN_MINSIZE: ${{ vars.RN_MINSIZE || '8000' }}
          POST_INTERVAL: ${{ vars.POST_INTERVAL || '1800' }}
          VERIFY_DELIVERY: 'true'
          DRY_RUN: ${{ inputs.dry_run }}
          AI_SUMMARY_ENABLED: ${{ vars.AI_SUMMARY_RUNNER != '' }}
        run: |
          runner=bot.py
          if [ "$AI_SUMMARY_ENABLED" = "true" ]; then
            runner=ai_summary_runner.py
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python "$runner" --dry-run
          else
            python "$runner"
          fi
      - name: Save durable article history
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_state.py save
      - name: Determine next publication time
        id: delay
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          POST_INTERVAL: ${{ vars.POST_INTERVAL || '1800' }}
        run: |
          python - <<'PY'
          import os, bot
          interval = bot.get_env_int('POST_INTERVAL', 1800, min_value=60, max_value=86400)
          delay = bot.next_cycle_delay(bot.load_history(bot.get_history_path()), interval)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'seconds={min(1800, delay)}\n')
          print(f'Next hosted check in {min(1800, delay)} seconds')
          PY

  next_cycle:
    needs: post
    if: ${{ always() && inputs.keep_running && !inputs.dry_run && vars.CONTINUOUS_PUBLISHING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    concurrency:
      group: wikipedia-next-cycle
      cancel-in-progress: false
    steps:
      - name: Wait until the next cycle is due
        env:
          CYCLE_DELAY: ${{ needs.post.outputs.cycle_delay || '1800' }}
        run: sleep "$CYCLE_DELAY"
      - name: Dispatch the next publication cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post-once.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f keep_running=true
